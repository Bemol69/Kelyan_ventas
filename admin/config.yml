# Configuración del panel /admin (Sveltia CMS)
# Cada cambio que se guarda aquí crea un commit en GitHub.
# Vercel arma la web (scripts/build.mjs) y la publica en ~30 segundos.

backend:
  name: github
  repo: %%GITHUB_REPO%%
  branch: main
  commit_messages:
    create: "Catálogo: crea {{collection}} «{{slug}}»"
    update: "Catálogo: actualiza {{collection}} «{{slug}}»"
    delete: "Catálogo: elimina {{collection}} «{{slug}}»"
    uploadMedia: "Catálogo: sube foto {{path}}"
    deleteMedia: "Catálogo: elimina foto {{path}}"

site_url: %%SITE_URL%%
display_url: %%SITE_URL%%
logo_url: ../img/logo.jpg

media_folder: img/productos
public_folder: /img/productos

# Nombres de archivo sin tildes ni ñ (ej: "Combo Diesel · Oval D" -> combo-diesel-oval-d.json)
slug:
  encoding: ascii
  clean_accents: true
  sanitize_replacement: "-"

# Las fotos del celular se achican y convierten a WebP al subirlas, para que la web cargue rápido
media_libraries:
  default:
    config:
      transformations:
        raster_image:
          format: webp
          quality: 85
          width: 1200
          height: 1200

collections:
  # ---------- CATEGORÍAS (filtros del catálogo) ----------
  - name: categorias
    label: Categorías
    label_singular: categoría
    description: "Los filtros del catálogo (Combos, Conjuntos, Polerones…). Abre uno para elegir qué productos aparecen en él. Las categorías sin productos no se muestran en la web."
    icon: filter_list
    folder: data/categorias
    format: json
    create: true
    delete: true
    identifier_field: nombre
    slug: "{{nombre}}"
    summary: "{{nombre}}"
    sortable_fields:
      fields: [orden, nombre]
      default:
        field: orden
        direction: ascending
    fields:
      - name: nombre
        label: Nombre del filtro
        widget: string
        hint: "Así aparece en la web. Ej: Conjuntos"

      - name: productos
        label: Productos en este filtro
        widget: relation
        collection: productos
        value_field: "{{slug}}"
        search_fields: [nombre]
        display_fields: ["{{nombre}} · ${{precio}}"]
        multiple: true
        required: false
        hint: "Busca y marca los productos. Un mismo producto puede estar en varios filtros. Para moverlo, quítalo de aquí y agrégalo en el otro."

      - name: orden
        label: Posición
        widget: number
        value_type: int
        default: 100
        hint: "Los números más bajos aparecen primero en la barra de filtros."

      - name: visible
        label: Mostrar en la web
        widget: boolean
        default: true
        hint: "Desactívalo para esconder el filtro sin borrarlo."

  # ---------- PRODUCTOS ----------
  - name: productos
    label: Productos
    label_singular: producto
    description: "Todos los productos. Para que un producto aparezca en un filtro, agrégalo desde Categorías."
    icon: storefront
    folder: data/productos
    format: json
    create: true
    delete: true
    identifier_field: nombre
    slug: "{{nombre}}"
    summary: "{{nombre}} · ${{precio}}"
    thumbnail: foto
    sortable_fields:
      fields: [orden, nombre, precio]
      default:
        field: orden
        direction: ascending
    fields:
      - name: nombre
        label: Nombre del producto
        widget: string

      - name: precio
        label: Precio
        widget: number
        value_type: int
        min: 0
        hint: "Solo números, sin puntos ni signo $. Ej: 35000. Pon 0 para mostrar «Consultar precio»."

      - name: foto
        label: Foto principal
        widget: image
        hint: "La que se ve en el catálogo. Ideal una foto vertical (3:4 o 4:5), como las del Instagram."

      - name: fotos
        label: Más fotos
        label_singular: foto
        widget: list
        required: false
        field:
          name: foto
          label: Foto
          widget: image
        hint: "Opcional. Otros ángulos, la etiqueta, puesto… La primera aparece al pasar el mouse sobre el producto."

      - name: descripcion
        label: Descripción
        widget: text
        required: false
        hint: "Opcional. Una o dos frases sobre el producto. Las tallas NO van aquí: van en el campo de abajo."

      - name: tallas
        label: Tallas disponibles
        label_singular: talla
        widget: list
        required: false
        field:
          name: talla
          label: Talla
          widget: string
        hint: "Una talla por línea (botón «Agregar talla»). Ej: XS, S, M, L, XL o 30, 32, 34. Déjalo vacío si es talla única (gorros). Cuando se agote una talla, bórrala de aquí."

      - name: etiqueta
        label: Etiqueta
        widget: string
        required: false
        hint: "Opcional. Aparece sobre la foto. Ej: Nuevo ingreso, Oferta, Últimas unidades."

      - name: orden
        label: Posición
        widget: number
        value_type: int
        default: 1000
        hint: "Los números más bajos aparecen primero en el catálogo."

      - name: agotado
        label: Agotado
        widget: boolean
        default: false
        hint: "Si está activado, se muestra 'Consultar stock' en vez de 'Agregar'."

      - name: visible
        label: Mostrar en la web
        widget: boolean
        default: true
        hint: "Desactívalo para ocultar el producto sin borrarlo."

  # ---------- AJUSTES (datos de contacto y portada) ----------
  - name: ajustes
    label: Ajustes de la tienda
    icon: settings
    files:
      - name: ajustes
        label: Contacto, entregas y portada
        file: data/ajustes.json
        format: json
        fields:
          - name: whatsapp
            label: WhatsApp para pedidos
            widget: string
            pattern: ['^\+?[0-9 ]{10,17}$', "Formato internacional, ej: 56912345678"]
            hint: "Con código de país y sin +. Ej: 56912345678"
          - { name: instagram, label: Usuario de Instagram, widget: string, required: false, hint: "Sin @. Déjalo vacío para ocultarlo." }
          - { name: tiktok, label: Usuario de TikTok, widget: string, required: false, hint: "Sin @. Déjalo vacío para ocultarlo." }
          - { name: email, label: Correo, widget: string, required: false }
          - { name: punto_entrega, label: Punto de entrega presencial, widget: string, hint: "Dónde entregas en persona. Ej: Metro Plaza Puente Alto" }
          - { name: ciudad, label: Comuna o ciudad, widget: string }
          - { name: region, label: Región, widget: string, required: false }
          - { name: envios, label: Cobertura de envíos, widget: string, required: false, hint: "Ej: Envíos a todo Chile" }
          - name: empresas_envio
            label: Empresas de envío
            widget: select
            multiple: true
            options: [Starken, Chilexpress, Blue Express]
            default: [Starken]
            hint: "Las que el cliente puede elegir al pedir un envío a otra ciudad."
          - { name: horario_dias, label: Días de atención, widget: string, required: false, hint: "Ej: Lunes a sábado. Vacío para no mostrarlo." }
          - { name: hora_abre, label: Hora de apertura, widget: string, required: false, pattern: ['^(\d{2}:\d{2})?$', "Formato HH:MM, ej 10:00"] }
          - { name: hora_cierra, label: Hora de cierre, widget: string, required: false, pattern: ['^(\d{2}:\d{2})?$', "Formato HH:MM, ej 20:00"] }
          - { name: hero_titulo, label: Título de la portada, widget: string }
          - { name: hero_destacado, label: Parte destacada del título, widget: string, required: false, hint: "Aparece en letra dorada cursiva al final del título." }
          - { name: hero_bajada, label: Texto bajo el título, widget: text }

  # ---------- REELS E IMÁGENES (sección «Así trabajamos» de la portada) ----------
  - name: inicio
    label: Reels e imágenes
    description: "Las 3 fotos o videos (reels) que se muestran en la portada, en la sección «Así trabajamos»."
    icon: movie
    files:
      - name: reels
        label: Reels e imágenes (3)
        file: data/reels.json
        format: json
        fields:
          - name: reels
            label: Reels e imágenes
            label_singular: reel
            widget: list
            min: 3
            max: 3
            allow_add: false
            allow_remove: false
            hint: "Siempre son 3. Para cambiar uno, reemplaza su foto o video. Puedes arrastrarlos para cambiar el orden."
            summary: "{{titulo}}"
            fields:
              - name: archivo
                label: Foto o video
                widget: file
                accept: "image/*,video/mp4,video/webm"
                media_folder: /img/reels
                public_folder: /img/reels
                hint: "Foto (JPG/PNG) o video MP4 vertical (descarga tu reel de Instagram), idealmente de menos de 15 segundos y 20 MB. Los videos se reproducen solos, sin sonido y en loop."
              - { name: titulo, label: Título, widget: string, required: false, hint: "Ej: Entrega en Plaza Puente Alto" }
              - { name: texto, label: Bajada, widget: string, required: false, hint: "Ej: Cliente feliz con su conjunto" }
              - { name: descripcion, label: Descripción de la imagen, widget: string, required: false, hint: "Qué se ve en la foto o video (para Google y lectores de pantalla)." }
